name: AI Issue to Code Draft

on:
  issues:
    types: [opened]

jobs:
  draft-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate and commit code draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_BODY="${{ github.event.issue.body }}"
          ISSUE_NUM="${{ github.event.issue.number }}"
          RESPONSE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$GEMINI_API_KEY" -H "Content-Type: application/json" -d "{\"contents\":[{\"parts\":[{\"text\":\"React 컴포넌트 코드만 작성해줘. 설명없이 코드만. 이슈: $ISSUE_TITLE\"}]}]}")
          CODE=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['candidates'][0]['content']['parts'][0]['text'])")
          mkdir -p src/components
          FILENAME=$(echo "$ISSUE_TITLE" | sed 's/ /-/g')
          echo "$CODE" > "src/components/${FILENAME}.jsx"
          git config user.name "gemini-bot"
          git config user.email "gemini-bot@auto.dev"
          git checkout -b "ai-draft/${ISSUE_NUM}"
          git add .
          git commit -m "AI draft for issue #${ISSUE_NUM}"
          git push origin "ai-draft/${ISSUE_NUM}"
          gh pr create --title "AI draft: $ISSUE_TITLE" --body "Closes #${ISSUE_NUM}" --base main --head "ai-draft/${ISSUE_NUM}"
