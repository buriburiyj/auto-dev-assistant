name: AI Issue to Code Draft

on:
  issues:
    types: [opened]

jobs:
  draft-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Full Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE=$(jq -r '.issue.title' "$GITHUB_EVENT_PATH")
          ISSUE_BODY=$(jq -r '.issue.body // empty' "$GITHUB_EVENT_PATH")
          ISSUE_NUM=$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")

          python3 << 'PYSCRIPT'
          import subprocess, json, os, re

          api_key = os.environ["GEMINI_API_KEY"]
          title = subprocess.run(["jq","-r",".issue.title",os.environ["GITHUB_EVENT_PATH"]], capture_output=True, text=True).stdout.strip()
          body = subprocess.run(["jq","-r",".issue.body // empty",os.environ["GITHUB_EVENT_PATH"]], capture_output=True, text=True).stdout.strip()

          def call_gemini(prompt):
              payload = json.dumps({"contents": [{"parts": [{"text": prompt}]}]})
              result = subprocess.run(["curl", "-s", f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key={api_key}", "-H", "Content-Type: application/json", "-d", payload], capture_output=True, text=True)
              try:
                  d = json.loads(result.stdout)
                  return d.get("candidates",[{}])[0].get("content",{}).get("parts",[{}])[0].get("text","")
              except:
                  return ""

          code = call_gemini(f"React 컴포넌트 코드만 작성해줘. 마크다운 코드블록 없이 순수 JSX만. export default 포함.\n이슈: {title}\n내용: {body}")
          code = re.sub(r'```[a-zA-Z]*\n?', '', code).strip()

          name = re.sub(r'[^a-zA-Z0-9 ]', '', title)
          filename = ''.join(w.capitalize() for w in name.split()) or 'Component'

          os.makedirs("src/components", exist_ok=True)
          with open(f"src/components/{filename}.jsx", "w") as f:
              f.write(code)

          review = call_gemini(f"다음 React 코드를 리뷰해줘. 한국어. 점수(X/10), 좋은점, 개선점, 접근성, 성능:\n{code}")
          audit = call_gemini(f"다음 React 코드의 성능과 접근성 감사 리포트. 표 형식, 이모지, 한국어:\n{code}")

          with open("/tmp/filename.txt", "w") as f:
              f.write(filename)
          with open("/tmp/review.txt", "w") as f:
              f.write(review)
          with open("/tmp/audit.txt", "w") as f:
              f.write(audit)
          PYSCRIPT

          FILENAME=$(cat /tmp/filename.txt)
          REVIEW=$(cat /tmp/review.txt)
          AUDIT=$(cat /tmp/audit.txt)

          git config user.name "gemini-bot"
          git config user.email "gemini-bot@auto.dev"
          BRANCH="ai-draft/${ISSUE_NUM}"
          git checkout -b "$BRANCH"
          git add .
          git commit -m "feat: AI draft for #${ISSUE_NUM} - ${ISSUE_TITLE}"
          git push origin "$BRANCH"

          gh pr create --title "feat: ${ISSUE_TITLE}" --body "Closes #${ISSUE_NUM}

          ## 🤖 AI 코드 리뷰
          ${REVIEW}

          ---
          ## 🔍 AI 성능/접근성 감사
          ${AUDIT}" --base main --head "$BRANCH"

          gh issue comment "$ISSUE_NUM" --body "AI가 코드를 생성하고 리뷰까지 완료했습니다! PR: ${PR_URL}"
