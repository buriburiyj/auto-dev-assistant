name: AI Issue to Code Draft

on:
  issues:
    types: [opened]

jobs:
  draft-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      - name: Generate code draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_BODY="${{ github.event.issue.body }}"
          gemini -p "다음 이슈를 보고 React 컴포넌트 초안 코드를 작성해줘. 이슈 제목: $ISSUE_TITLE, 내용: $ISSUE_BODY. src/components/ 폴더에 적절한 파일명으로 저장해줘."

      - name: Commit and create PR
        run: |
          git config user.name "gemini-bot"
          git config user.email "gemini-bot@auto.dev"
          git checkout -b "ai-draft/${{ github.event.issue.number }}"
          git add .
          git commit -m "AI draft for issue #${{ github.event.issue.number }}"
          git push origin "ai-draft/${{ github.event.issue.number }}"
