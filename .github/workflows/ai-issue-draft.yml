name: AI Issue to Code Draft

on:
  issues:
    types: [opened]

jobs:
  draft-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Full Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          ISSUE_TITLE=$(jq -r '.issue.title' "$GITHUB_EVENT_PATH")
          ISSUE_BODY=$(jq -r '.issue.body // empty' "$GITHUB_EVENT_PATH")
          ISSUE_NUM=$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")
          export ISSUE_TITLE ISSUE_BODY ISSUE_NUM
          python3 /dev/stdin << 'PYSCRIPT'
          import subprocess, json, os, re

          api_key = os.environ["GEMINI_API_KEY"]
          title = os.environ.get("ISSUE_TITLE","")
          body = os.environ.get("ISSUE_BODY","")

          prompt = "다음 GitHub 이슈를 보고 3가지를 한번에 해줘.\n"
          prompt += "이슈 제목: " + title + "\n"
          prompt += "이슈 내용: " + body + "\n\n"
          prompt += "반드시 아래 형식 그대로 출력해줘:\n\n"
          prompt += "===CODE_START===\n"
          prompt += "(React 컴포넌트 순수 JSX 코드만. 마크다운 코드블록 없이. export default 포함)\n"
          prompt += "===CODE_END===\n\n"
          prompt += "===REVIEW_START===\n"
          prompt += "(코드 리뷰. 한국어. 점수 X/10, 좋은점, 개선점, 접근성, 성능)\n"
          prompt += "===REVIEW_END===\n\n"
          prompt += "===AUDIT_START===\n"
          prompt += "(성능/접근성 감사 리포트. 이모지, 표 형식, 한국어)\n"
          prompt += "===AUDIT_END===\n"

          payload = json.dumps({"contents": [{"parts": [{"text": prompt}]}]})
          url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=" + api_key
          result = subprocess.run(["curl", "-s", url, "-H", "Content-Type: application/json", "-d", payload], capture_output=True, text=True)

          try:
              d = json.loads(result.stdout)
              text = d["candidates"][0]["content"]["parts"][0]["text"]
          except:
              text = ""

          code_m = re.search(r'===CODE_START===\s*(.*?)\s*===CODE_END===', text, re.DOTALL)
          review_m = re.search(r'===REVIEW_START===\s*(.*?)\s*===REVIEW_END===', text, re.DOTALL)
          audit_m = re.search(r'===AUDIT_START===\s*(.*?)\s*===AUDIT_END===', text, re.DOTALL)

          code = code_m.group(1).strip() if code_m else "// no code"
          code = re.sub(r'```[a-zA-Z]*\n?', '', code).strip()
          review = review_m.group(1).strip() if review_m else "리뷰 생성 실패"
          audit = audit_m.group(1).strip() if audit_m else "감사 생성 실패"

          name_clean = re.sub(r'[^a-zA-Z0-9 ]', '', title)
          filename = ''.join(w.capitalize() for w in name_clean.split()) or 'Component'

          os.makedirs("src/components", exist_ok=True)
          with open("src/components/" + filename + ".jsx", "w") as f:
              f.write(code)
          with open("/tmp/filename.txt", "w") as f:
              f.write(filename)
          with open("/tmp/review.txt", "w") as f:
              f.write(review)
          with open("/tmp/audit.txt", "w") as f:
              f.write(audit)
          PYSCRIPT

          FILENAME=$(cat /tmp/filename.txt)
          REVIEW=$(cat /tmp/review.txt)
          AUDIT=$(cat /tmp/audit.txt)

          git config user.name "gemini-bot"
          git config user.email "gemini-bot@auto.dev"
          BRANCH="ai-draft/${ISSUE_NUM}"
          git checkout -b "$BRANCH"
          git add .
          git commit -m "feat: AI draft for #${ISSUE_NUM} - ${ISSUE_TITLE}"
          git push origin "$BRANCH"

          gh pr create --title "feat: ${ISSUE_TITLE}" --body "Closes #${ISSUE_NUM}

## 🤖 AI 코드 리뷰
${REVIEW}

---
## 🔍 AI 성능/접근성 감사
${AUDIT}" --base main --head "$BRANCH"

          gh issue comment "$ISSUE_NUM" --body "AI가 코드 생성 + 리뷰 + 감사 완료! PR을 확인해주세요."
