name: AI Performance and A11y Audit

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=$(find src/components -name "*.jsx" -o -name "*.tsx" 2>/dev/null | head -10)
          if [ -z "$FILES" ]; then echo "No components" && exit 0; fi

          python3 << 'AUDIT_SCRIPT'
          import subprocess, json, os

          files = subprocess.run(["find", "src/components", "-name", "*.jsx", "-o", "-name", "*.tsx"], capture_output=True, text=True).stdout.strip().split("\n")
          code = ""
          for f in files:
              if f and os.path.exists(f):
                  with open(f) as fh:
                      code += f"\n--- {f} ---\n{fh.read()}"

          prompt = f"다음 React 코드의 성능과 접근성 감사 리포트를 작성해줘. 표 형식, 이모지, 한국어로:\n{code}"
          payload = json.dumps({"contents": [{"parts": [{"text": prompt}]}]})

          api_key = os.environ["GEMINI_API_KEY"]
          result = subprocess.run(["curl", "-s", f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key={api_key}", "-H", "Content-Type: application/json", "-d", payload], capture_output=True, text=True)

          d = json.loads(result.stdout)
          audit = d.get("candidates", [{}])[0].get("content", {}).get("parts", [{}])[0].get("text", "감사 실패")

          with open("/tmp/audit.txt", "w") as f:
              f.write(audit)
          AUDIT_SCRIPT

          AUDIT=$(cat /tmp/audit.txt)
          PR_NUM="${{ github.event.pull_request.number }}"
          gh pr comment "$PR_NUM" --body "## 🔍 AI 성능/접근성 감사 리포트

          $AUDIT"
