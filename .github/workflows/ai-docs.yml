name: AI Auto Documentation

on:
  push:
    branches: [main]
    paths:
      - 'src/components/**'

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate docs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 << 'DOCS_SCRIPT'
          import subprocess, json, os, glob

          files = glob.glob("src/components/**/*.jsx", recursive=True) + glob.glob("src/components/**/*.tsx", recursive=True)
          if not files:
              print("No components")
              exit(0)

          code = ""
          for f in files:
              with open(f) as fh:
                  code += f"\n--- {f} ---\n{fh.read()}"

          prompt = f"다음 React 컴포넌트들의 문서를 마크다운으로 작성해줘. 각 컴포넌트별 설명, Props 표, 사용 예시 포함. 한국어로:\n{code}"
          payload = json.dumps({"contents": [{"parts": [{"text": prompt}]}]})

          api_key = os.environ["GEMINI_API_KEY"]
          result = subprocess.run(["curl", "-s", f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key={api_key}", "-H", "Content-Type: application/json", "-d", payload], capture_output=True, text=True)

          d = json.loads(result.stdout)
          docs = d.get("candidates", [{}])[0].get("content", {}).get("parts", [{}])[0].get("text", "문서 생성 실패")

          with open("COMPONENTS.md", "w") as f:
              f.write(docs)
          DOCS_SCRIPT

          git config user.name "gemini-bot"
          git config user.email "gemini-bot@auto.dev"
          git add COMPONENTS.md
          git diff --cached --quiet || (git commit -m "docs: auto-update component documentation" && git push origin main)
