name: AI Auto Documentation

on:
  push:
    branches: [main]
    paths:
      - 'src/components/**'

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate docs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          FILES=$(find src/components -name "*.jsx" -o -name "*.tsx" 2>/dev/null)
          if [ -z "$FILES" ]; then
            echo "No components found"
            exit 0
          fi

          CODE=""
          for f in $FILES; do
            CONTENT=$(cat "$f")
            CODE="${CODE}
--- ${f} ---
${CONTENT}
"
          done

          PROMPT="다음 React 컴포넌트들의 문서를 마크다운으로 작성해줘. 한국어로.
          형식:
          # 컴포넌트 문서
          ## [컴포넌트명]
          ### 설명
          ### Props
          | Prop | 타입 | 기본값 | 설명 |
          ### 사용 예시 (코드)
          ---
          마지막에 '마지막 업데이트: (오늘 날짜)' 추가

          코드:
          $CODE"

          ESCAPED_PROMPT=$(echo "$PROMPT" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")

          RESPONSE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"contents\":[{\"parts\":[{\"text\":$ESCAPED_PROMPT}]}]}")

          DOCS=$(echo "$RESPONSE" | python3 -c "
          import sys, json, re
          d = json.load(sys.stdin)
          text = d.get('candidates',[{}])[0].get('content',{}).get('parts',[{}])[0].get('text','문서 생성 실패')
          text = re.sub(r'\`\`\`[a-zA-Z]*\n?', '', text)
          print(text)
          ")

          echo "$DOCS" > COMPONENTS.md

          git config user.name "gemini-bot"
          git config user.email "gemini-bot@auto.dev"
          git add COMPONENTS.md
          git diff --cached --quiet || (git commit -m "docs: auto-update component documentation" && git push origin main)
